# Builds the installers for Windows, Linux and macOS, and the Android APK, and publishes them to the public
# releases repository (package.json → build.publish) whenever a version tag is pushed, or by hand from the
# Actions tab. Installed copies on every device then pick the new version up on their own (main/updater.js
# on computers, mobile/update-phone.js on the phone).
#
# Needs one repository secret: RELEASES_TOKEN, a classic personal access token with the "repo" scope.
# (A fine-grained token with Contents: read and write passes the check below but GitHub still refuses
# release-asset uploads from it with "Resource not accessible by personal access token".)
#
# The Mac (Apple chip and Intel) and Windows installers are unsigned until their signing secrets are added
# (see "Build and publish" below): until then macOS asks the person to allow Romulus in System Settings and
# Windows shows a SmartScreen warning. Store builds (Google Play .aab, Microsoft Store .appx) are attached to
# the run as artifacts, not published to the releases page.
#
# Supply chain: every action below is pinned to a commit SHA (the version is in the trailing comment;
# Dependabot keeps them current), the workflow's own GITHUB_TOKEN can only read this repository, and each
# OS job attaches a SHA256SUMS-<os>.txt to the release so a download can be checked (SECURITY.md).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            target: --win
          - os: ubuntu-latest
            name: linux
            target: --linux
          - os: macos-latest
            name: mac
            target: --mac
    runs-on: ${{ matrix.os }}
    env:
      # the app's own Google / Microsoft sign-in clients, when the repository has them as a secret
      # (job-level so the step's `if` below can see it: a step's own env isn't set when its `if` is evaluated)
      OAUTH_CLIENTS_JSON: ${{ secrets.OAUTH_CLIENTS_JSON }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # fail fast, and say why, when the token can't write to the releases repository
      - name: Check the releases token
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        shell: bash
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "RELEASES_TOKEN secret is not set"; exit 1; fi
          perms=$(gh api repos/jamesbobdev-gif/romulus-releases --jq '.permissions' 2>&1) || { echo "RELEASES_TOKEN can't read the releases repository: $perms"; exit 1; }
          echo "token permissions on romulus-releases: $perms"
          echo "$perms" | grep -q '"push":true' || { echo "RELEASES_TOKEN has no write (Contents: read and write) access to romulus-releases"; exit 1; }
      - run: npm ci
      # Known vulnerabilities. Critical only for now: electron and electron-builder still carry known highs
      # until they're upgraded; raise this to --audit-level=high once Electron is current. What ships in the
      # app (dependencies) is checked strictly; the build tooling (devDependencies: electron-builder pulls in
      # an old tar with a critical advisory, fixed only in electron-builder 26) is reported as a warning
      # until that upgrade lands, after which the second line can go and the first can drop --omit=dev.
      - name: npm audit
        shell: bash
        run: |
          npm audit --audit-level=critical --omit=dev
          npm audit --audit-level=critical || echo "::warning::npm audit found critical advisories in the build tooling (devDependencies); upgrade electron-builder"
      - run: npm test
      - name: OAuth clients
        if: ${{ env.OAUTH_CLIENTS_JSON != '' }}
        shell: bash
        run: printf '%s' "$OAUTH_CLIENTS_JSON" > oauth-clients.json
      # Signing, each part only once its secrets exist; until then that installer is built unsigned as before.
      # Mac (Apple Developer Program): MAC_CSC_LINK (the Developer ID Application certificate as a base64
      # .p12), MAC_CSC_KEY_PASSWORD, and for notarization APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID.
      # Windows (Azure Trusted Signing): secrets AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET and
      # repository variables AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_CERT_PROFILE.
      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ matrix.name == 'mac' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.name == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.name == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.name == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.name == 'mac' && secrets.APPLE_TEAM_ID || '' }}
          AZURE_TENANT_ID: ${{ matrix.name == 'windows' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ matrix.name == 'windows' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ matrix.name == 'windows' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ vars.AZURE_CERT_PROFILE }}
        shell: bash
        run: |
          extra=()
          if [ "${{ matrix.name }}" = windows ] && [ -n "$AZURE_SIGNING_ENDPOINT" ] && [ -n "$AZURE_CLIENT_SECRET" ]; then
            echo "signing the Windows installer with Azure Trusted Signing"
            extra=(-c.win.azureSignOptions.endpoint="$AZURE_SIGNING_ENDPOINT"
                   -c.win.azureSignOptions.codeSigningAccountName="$AZURE_SIGNING_ACCOUNT"
                   -c.win.azureSignOptions.certificateProfileName="$AZURE_CERT_PROFILE")
          fi
          if [ "${{ matrix.name }}" = mac ] && [ -z "$CSC_LINK" ]; then echo "no MAC_CSC_LINK secret: the Mac build is unsigned"; fi
          npx electron-builder ${{ matrix.target }} --publish always "${extra[@]}"
      # SHA-256 of every installer this job built, so a download can be checked against the release page
      # (SECURITY.md and the releases repository's README say how). One file per OS: SHA256SUMS-<os>.txt.
      - name: Checksums
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          SUMS: SHA256SUMS-${{ matrix.name }}.txt
        shell: bash
        run: |
          shopt -s nullglob
          cd dist
          files=(*.exe *.AppImage *.dmg *.zip)
          if [ ${#files[@]} -eq 0 ]; then echo "no installers in dist/"; exit 1; fi
          if command -v sha256sum >/dev/null; then sha256sum "${files[@]}" > "$SUMS"; else shasum -a 256 "${files[@]}" > "$SUMS"; fi
          cat "$SUMS"
          # the release this run publishes to: the pushed tag, or v<package.json version> when started by hand
          if [ "$GITHUB_REF_TYPE" = tag ]; then TAG="$GITHUB_REF_NAME"; else TAG="v$(node -p "require('../package.json').version")"; fi
          gh release upload --repo jamesbobdev-gif/romulus-releases "$TAG" "$SUMS" --clobber
      # The Microsoft Store package (.appx), once the app is reserved in Partner Center: its Product identity
      # page gives the three repository variables below. The Store signs the package itself, so it isn't
      # published to the releases page (unsigned, it won't install from there); download it from this run's
      # artifacts and upload it in Partner Center.
      - name: Microsoft Store package
        if: ${{ matrix.name == 'windows' && vars.MS_STORE_PUBLISHER != '' }}
        env:
          IDENTITY: ${{ vars.MS_STORE_IDENTITY_NAME }}
          PUBLISHER: ${{ vars.MS_STORE_PUBLISHER }}
          PUBLISHER_NAME: ${{ vars.MS_STORE_PUBLISHER_NAME }}
        shell: bash
        run: npx electron-builder --win appx --publish never -c.appx.identityName="$IDENTITY" -c.appx.publisher="$PUBLISHER" -c.appx.publisherDisplayName="$PUBLISHER_NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ matrix.name == 'windows' && vars.MS_STORE_PUBLISHER != '' }}
        with:
          name: microsoft-store-appx
          path: dist/*.appx
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.dmg
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
            dist/SHA256SUMS-*.txt
          if-no-files-found: ignore

  # The Android app, signed and uploaded to the same release, so phones update too (mobile/update-phone.js
  # shows "Update" when a newer APK is there). Needs four more secrets: ANDROID_KEYSTORE_BASE64 (the
  # keystore file, base64), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD. Every
  # release must be signed with the same key or Android refuses to install one over the other. Without the
  # keystore secret this job says so and ends; the desktop installers are unaffected.
  android:
    runs-on: ubuntu-latest
    needs: build # the release exists once the desktop builds have published to it
    if: ${{ always() && needs.build.result != 'cancelled' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Signing key
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is not set: no phone build for this release"
            echo "present=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "present=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.keystore.outputs.present == 'true'
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        if: steps.keystore.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: 21
      - name: Build the APK
        if: steps.keystore.outputs.present == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          cd mobile
          npm ci
          node prepare-www.js   # no sync-config.json here: the public build bakes in no keys
          npx cap sync android
          cd android
          chmod +x gradlew
          # the APK for the releases page, and the bundle for Google Play (build.gradle: productFlavors). The same
          # key signs both; on Play it is the upload key, and Play re-signs what it hands out.
          ./gradlew --no-daemon assembleGithubRelease bundlePlayRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          version=$(node -p "require('../../package.json').version")
          mv app/build/outputs/apk/github/release/app-github-release.apk "$RUNNER_TEMP/Romulus-$version.apk"
          mv app/build/outputs/bundle/playRelease/app-play-release.aab "$RUNNER_TEMP/Romulus-$version-play.aab"
          echo "APK=$RUNNER_TEMP/Romulus-$version.apk" >> "$GITHUB_ENV"
          echo "AAB=$RUNNER_TEMP/Romulus-$version-play.aab" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"
      - name: Upload to the release
        if: steps.keystore.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        shell: bash
        run: |
          gh release upload "$TAG" "$APK" --repo jamesbobdev-gif/romulus-releases --clobber
          # its checksum too, in the same form as the desktop ones
          (cd "$(dirname "$APK")" && sha256sum "$(basename "$APK")" > SHA256SUMS-android.txt && cat SHA256SUMS-android.txt)
          gh release upload "$TAG" "$(dirname "$APK")/SHA256SUMS-android.txt" --repo jamesbobdev-gif/romulus-releases --clobber
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.keystore.outputs.present == 'true'
        with:
          name: android-apk
          path: |
            ${{ env.APK }}
            ${{ runner.temp }}/SHA256SUMS-android.txt
      # the Google Play bundle stays off the public releases page (phones can't install an .aab); download it
      # from this run's artifacts and upload it in the Play Console
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.keystore.outputs.present == 'true'
        with:
          name: google-play-aab
          path: ${{ env.AAB }}
