# Publishes site/ (the download page) to GitHub Pages whenever it changes on main, or by hand from the
# Actions tab. One-time setup in the repository: Settings → Pages → Source: "GitHub Actions". The page
# then lives at https://jamesbobdev-gif.github.io/Romulus/ and reads the latest release from the releases
# repository (package.json → build.publish) in the visitor's browser, so a new release needs no edit here.
#
# Supply chain: every action is pinned to a commit SHA (version in the trailing comment; Dependabot keeps
# them current), and the job gets only the permissions Pages needs.
name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
