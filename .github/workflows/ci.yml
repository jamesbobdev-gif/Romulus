# Runs the unit tests and the linter on every push and pull request, so a change is checked when it is
# made rather than at release time (release.yml runs the tests again before building the installers).
#
# Supply chain: every action is pinned to a commit SHA (version in the trailing comment; Dependabot keeps
# them current), and the job's token can only read this repository.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
