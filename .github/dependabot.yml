# Weekly dependency updates: the desktop app, the Android wrapper and the actions the release workflow pins
# by commit SHA (Dependabot bumps the SHA and the version comment together). Minor and patch bumps arrive
# as one pull request per ecosystem; majors (Electron, electron-builder, Capacitor) come on their own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
